---
layout: default
title: 首页
---
<section class="hero">
  <p class="eyebrow">真实体验 · 清晰判断</p>
  <h1>把复杂产品，<br>讲得简单一点。</h1>
  <p>分享网络工具、效率产品与数字生活体验。既写优点，也说明限制。</p>
</section>

<section class="articles">
  <div class="section-heading">
    <h2>最新文章</h2>
    <span>{{ site.posts | size }} 篇</span>
  </div>
  {% for post in site.posts %}
  <article class="card">
    <div>
      <p class="eyebrow">{{ post.category | default: "产品测评" }}</p>
      <h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
      <p>{{ post.description }}</p>
    </div>
    <time>{{ post.date | date: "%Y.%m.%d" }}</time>
  </article>
  {% endfor %}
</section>
