name: Submit URLs to Baidu

on:
  workflow_dispatch:
  schedule:
    - cron: "30 15 * * *"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build public URL list
        shell: bash
        run: |
          set -euo pipefail

          {
            printf '%s\n' \
              'https://blog.a80s.com/' \
              'https://blog.a80s.com/about/'

            while IFS= read -r -d '' post; do
              front_matter=$(awk '
                NR == 1 && $0 == "---" { inside = 1; next }
                inside && $0 == "---" { exit }
                inside { print }
              ' "${post}")

              if printf '%s\n' "${front_matter}" \
                | grep -Eiq '^(hidden:[[:space:]]*true|sitemap:[[:space:]]*false)[[:space:]]*$'; then
                continue
              fi

              permalink=$(printf '%s\n' "${front_matter}" \
                | awk -F':[[:space:]]*' '$1 == "permalink" { print $2; exit }' \
                | tr -d "\"'")

              if [ -z "${permalink}" ]; then
                filename=$(basename "${post}")
                slug=${filename#????-??-??-}
                slug=${slug%.*}
                permalink="/articles/${slug}/"
              fi

              # Keep the sponsored review out even if its front matter changes later.
              if [ "${permalink}" = "/articles/boostnet-review/" ]; then
                continue
              fi

              printf 'https://blog.a80s.com%s\n' "${permalink}"
            done < <(find _posts -maxdepth 1 -type f \
              \( -name '*.md' -o -name '*.markdown' -o -name '*.html' \) \
              -print0)
          } | sort -u > urls.txt

          if [ ! -s urls.txt ]; then
            echo "No eligible public URLs found in repository."
            exit 1
          fi

          echo "Submitting $(wc -l < urls.txt) URLs:"
          sed 's/^/  - /' urls.txt

      - name: Submit URLs to Baidu
        shell: bash
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${BAIDU_PUSH_TOKEN}" ]; then
            echo "BAIDU_PUSH_TOKEN is not configured."
            exit 1
          fi

          response=$(curl --fail --silent --show-error \
            -H "Content-Type: text/plain" \
            --data-binary @urls.txt \
            "http://data.zz.baidu.com/urls?site=https://blog.a80s.com&token=${BAIDU_PUSH_TOKEN}")

          echo "${response}" | jq .

          if echo "${response}" | jq -e 'has("error")' >/dev/null; then
            echo "Baidu rejected the submission."
            exit 1
          fi

          echo "${response}" | jq -e 'has("success")' >/dev/null
