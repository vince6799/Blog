<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <style>{% include styles.css %}{% include sections.css %}{% include about.css %}</style>
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <meta name="theme-color" content="#17201c">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {% if site.google_analytics %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', '{{ site.google_analytics }}');
  </script>
  {% endif %}
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}"><span>网</span>{{ site.title }}</a>
    <nav aria-label="主导航">
      <a href="{{ '/' | relative_url }}">文章</a>
      <a href="{{ '/about/' | relative_url }}">关于</a>
      <a class="rss-link" href="{{ '/feed.xml' | relative_url }}" title="订阅 RSS">RSS</a>
    </nav>
  </header>
  <main>{{ content }}</main>
  <footer>
    <strong>{{ site.title }}</strong>
    <span>© {{ 'now' | date: '%Y' }} · 经验、感悟、测评与日常记录 · <a href="{{ '/feed.xml' | relative_url }}">RSS 订阅</a></span>
  </footer>
</body>
</html>
