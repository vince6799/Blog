<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="主导航">
      <a href="{{ '/' | relative_url }}">文章</a>
      <a href="{{ '/about/' | relative_url }}">关于</a>
    </nav>
  </header>
  <main>{{ content }}</main>
  <footer>© {{ 'now' | date: '%Y' }} {{ site.title }} · 内容仅供参考</footer>
</body>
</html>
